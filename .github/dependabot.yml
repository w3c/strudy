version: 2
updates:
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: daily
    time: '09:00'
  cooldown:
    default-days: 7
    exclude:
      # Packages that we usually want to get as soon as possible
      - "cddlparser"
      - "reffy"
      - "webidl2"
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: daily
    time: '09:00'
  groups:
    actions-dependencies:
      patterns:
        - "*"
